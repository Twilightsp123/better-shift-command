name: T2-MOVE-A Shadow Offline

on:
  push:
    branches:
      - maintenance/t2move-a-shadow
  workflow_dispatch:

permissions:
  contents: read

jobs:
  move-a-shadow:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
      - name: Ensure frozen runtime bytes
        run: |
          test "$(git hash-object source/better_shift_command.lua)" = "e36252b037b4d2dabd7e98cf72979fb41a1ffe80"
          test "$(git hash-object src/better_shift_command.lua)" = "e36252b037b4d2dabd7e98cf72979fb41a1ffe80"
          test "$(git hash-object src/better_shift_command_selfcontained.template.lua)" = "70b4db90c4848150a4f3aeab0359fb18b7262064"
      - name: T2-MOVE-A pure shadow fixtures
        run: |
          lua5.1 maintenance_tools/t2move_a/test_t2move_a_shadow.lua maintenance_tools/t2move_a/t2move_a_shadow.lua
      - name: T2-MOVE-A shadow mutations
        run: |
          python maintenance_tools/t2move_a/test_t2move_a_mutations.py
      - name: No gameplay activation contract
        run: |
          python maintenance_tools/t2move_a/test_t2move_a_scope.py
      - name: Documentation contract
        run: |
          python maintenance_tools/check_documentation_contract.py
      - name: Existing full maintenance suite
        run: |
          python maintenance_tools/run_checks_corepath_rc8.py
