name: BSC T1.5 Full Validation v2

on:
  push:
    branches:
      - ci/t1.5-full-validation-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Generate final-tree checksum
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, pathlib, subprocess
          skip = {
              'SHA256SUMS.txt',
              '.github/workflows/t15-full-validation-v2.yml',
          }
          raw = subprocess.check_output(['git','ls-files','-z'])
          paths = sorted(x.decode('utf-8') for x in raw.split(b'\0') if x)
          out = []
          for rel in paths:
              if rel in skip:
                  continue
              data = pathlib.Path(rel).read_bytes()
              out.append(f"{hashlib.sha256(data).hexdigest()}  {rel}")
          pathlib.Path('/tmp/SHA256SUMS.txt').write_text('\n'.join(out)+'\n', encoding='utf-8')
          print(f"checksum_entries={len(out)}")
          PY

      - name: Upload checksum artifact
        uses: actions/upload-artifact@v4
        with:
          name: t15-final-checksum
          path: /tmp/SHA256SUMS.txt
          if-no-files-found: error

      - name: Install Lua
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.3

      - name: Compile Python
        shell: bash
        run: python -m compileall -q maintenance_tools tests tools steering_tests

      - name: Documentation contract
        shell: bash
        run: python maintenance_tools/check_documentation_contract.py

      - name: Full maintenance suite
        shell: bash
        run: python maintenance_tools/run_checks_corepath_rc8.py
