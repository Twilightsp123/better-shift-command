name: NQTR document migration and authority gates

on:
  push:
    branches:
      - architecture/native-queue-transition-rewrite-docs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Archive byte preservation and current-doc authority
        run: python maintenance_tools/nqtr_docs_contract.py
      - name: Historical D1 contracts plus new NQTR source guidance
        run: python maintenance_tools/check_documentation_contract.py
