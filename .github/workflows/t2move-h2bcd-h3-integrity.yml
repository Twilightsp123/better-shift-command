name: T2-MOVE-H2BCD H3 Route Integrity

on:
  push:
    branches:
      - maintenance/t2move-h2bcd-h3-route-integrity
  pull_request:
    branches:
      - maintenance/t2move-h1-route-obligation-shadow
  workflow_dispatch:

permissions:
  contents: read

jobs:
  move-e:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
      - name: Compile Python and verify isolated E code contract
        run: |
          python -m compileall -q maintenance_tools tests
          python maintenance_tools/t2move_a/test_t2move_e_contract.py
          python maintenance_tools/t2move_a/test_t2move_d_snapshot_contract.py
      - name: Stage A/B pure evidence plus mutations
        run: |
          lua5.1 maintenance_tools/t2move_a/test_t2move_a_shadow.lua maintenance_tools/t2move_a/t2move_a_shadow.lua
          python maintenance_tools/t2move_a/test_t2move_a_mutations.py
          lua5.1 maintenance_tools/t2move_a/test_t2move_b_shadow.lua maintenance_tools/t2move_a/t2move_a_shadow.lua maintenance_tools/t2move_a/t2move_b_shadow.lua
          python maintenance_tools/t2move_a/test_t2move_b_mutations.py
      - name: Stage C/D evidence and transaction gates
        run: |
          lua5.1 maintenance_tools/t2move_a/test_t2move_c_txn_shadow.lua maintenance_tools/t2move_a/t2move_a_shadow.lua maintenance_tools/t2move_a/t2move_b_shadow.lua maintenance_tools/t2move_a/t2move_c_txn_shadow.lua
          python maintenance_tools/t2move_a/test_t2move_c_mutations.py
          lua5.1 maintenance_tools/t2move_a/test_t2move_d_evidence.lua source/t2move_d_evidence.lua
          python maintenance_tools/t2move_a/test_t2move_d_mutations.py
      - name: H1 pure route-credit proof cases
        run: |
          lua5.1 maintenance_tools/t2move_a/test_t2move_h1_pure.lua source/t2move_h1_route_obligation.lua
      - name: H2-B/C/D real controller safe ISSUE/ACK and debt tests
        run: |
          lua5.1 maintenance_tools/t2move_a/test_t2move_h2bcd_controller.lua source/better_shift_command.lua tests/fixture.lua
      - name: H3 stress real controller deterministic routes
        run: |
          lua5.1 maintenance_tools/t2move_a/test_t2move_h3_stress.lua source/better_shift_command.lua tests/fixture.lua
      - name: H3 Native exact successor route-credit parity
        run: |
          lua5.1 maintenance_tools/t2move_h3_native.lua source/better_shift_command.lua tests/fixture.lua
      - name: H2-B/C/D route fidelity and credit mutation gates
        run: |
          python maintenance_tools/t2move_a/test_t2move_h2bcd_mutations.py
      - name: Documentation contract
        run: |
          python maintenance_tools/check_documentation_contract.py
      - name: Full maintenance suite
        run: |
          python maintenance_tools/run_checks_corepath_rc8.py
      - name: Build test PACK and SHA256 sealed full-source archive
        run: |
          python maintenance_tools/t2move_a/seal_t2move_h2h3.py
      - name: Upload complete H2BCD-H3 source + ordinary/diagnostic Windows test PACK
        uses: actions/upload-artifact@v4
        with:
          name: BSC-T2MOVE-H2BCD-H3-full-source-testpack-20261009
          if-no-files-found: error
          retention-days: 90
          path: |
            output/BSC_T2MOVE_H2BCD_H3_full_source_20261009.zip
            output/zzz_better_shift_command_steam.pack
            output/zzz_better_shift_command_steam_H2H3_debug.pack
            output/H2H3_MANIFEST.json
            output/H2H3_SOURCE_FILE_SHA256.txt
            output/H2H3_HANDOFF_SHA256SUMS.txt
            output/READ_THIS_BEFORE_TESTING.txt
